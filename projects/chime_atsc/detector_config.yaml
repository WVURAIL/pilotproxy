# Detector geometry for this project. The kernel of record (2.3.0) is built for
# these values; they are declared here so the characterization can read them.
detector_window: 128     # K, samples per detector row
fine_bins: 256           # L_F = 2 nfft / K
nfft: 16384              # samples per frame
feed_sum: all_inputs     # P = n_inputs * K (2048 * 128 = 262144 on CHIME)
