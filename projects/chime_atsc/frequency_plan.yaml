# Frequency plan: ATSC UHF physical channels inside CHIME's 400-800 MHz band.
# An explicit band list (no formula in code). Edges are integer MHz, so they
# parse to the same floats as 470 + 6 (ch - 14).
#   role screened: a band the characterization screens for its emitter.
#   role control:  a band with no licensed transmitter, processed the same way
#                  as a reference. Channel 37 (608-614 MHz) is the protected
#                  allocation; its target is freq_id 491, the coarse channel of
#                  the nominal marker position 608.309441 MHz (off DC), per the
#                  author decision of 2026-09-24.
name: atsc_uhf
