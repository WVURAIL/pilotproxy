# Green Bank Outrigger (GBO). The channelization is CHIME-compatible, so the
# outrigger inherits all of CHIME's geometry with `extends` and overrides the
# feed count and scope. Its feed layout and site are not recorded.
name: gbo
extends: chime

n_feeds: 256             # outrigger feed count (CHIME has 2048), the same for gbo, hco and kko

scopes:
  - gbo.event.baseband.raw

feed_layout: null       # not recorded, so CHIME's layout is not inherited
site: null               # not recorded, so CHIME's site is not inherited
